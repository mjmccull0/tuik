direction: vertical
panes:
  - id: "header"
    title: |
      ______ _    _ _____ _   __
      |_  __| |  | |_   _| | / /
        | | | |  | | | | | |/ / 
        | | | |/\| | | | |    \ 
        | | \  /\  /_| |_| |\  \
        |_|  \/  \/ \___/\_| \_/ 
    type: "static"
  - direction: horizontal
    height_pc: 85
    panes:
      - id: "input_pane"
